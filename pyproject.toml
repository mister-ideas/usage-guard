[project]
name = "usage-guard"
version = "0.2.6"
description = "Hermes Agent plugin: fail-closed subscription usage guard"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501 handled by line-length; plugin strings can be long.
ignore = ["E501"]
