name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Byte-compile backend sources
        run: python -m py_compile __init__.py scripts/package.py

      - name: Collect tests (zero collection fails the job)
        run: |
          # -p no:cacheprovider and -o addopts= override the pyproject addopts;
          # parse the "N tests collected" summary line instead of node IDs.
          summary=$(python -m pytest tests --collect-only -q -p no:cacheprovider -o addopts= 2>/dev/null | tail -1)
          count=$(echo "$summary" | grep -oE '^[0-9]+' || echo 0)
          echo "collected: $summary"
          if [ "${count:-0}" -lt 10 ]; then
            echo "::error::expected a real test suite, collected $count"; exit 1
          fi
        shell: bash

      - name: Run offline unit tests
        run: python -m pytest tests/test_guard.py tests/test_robustness.py -v

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check .

      - name: Packaging smoke test
        run: |
          python scripts/package.py
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          zips = list(Path("dist").glob("usage-guard-*.zip"))
          assert len(zips) == 1, zips
          names = ZipFile(zips[0]).namelist()
          for required in ("usage-guard/plugin.yaml", "usage-guard/__init__.py", "usage-guard/README.md"):
              assert required in names, (required, names)
          assert not any("/tests/" in n for n in names), names
          print("package OK:", zips[0].name)
          PY
        shell: bash

  host-contract:
    name: Host contract (pinned Hermes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone pinned Hermes revision
        run: |
          # Pinned to an exact commit: bump it deliberately in the same PR as
          # requires_hermes. Do not add a tag fallback — a tag that resolves
          # differently upstream would silently clone unpinned main.
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git /tmp/core
          git -C /tmp/core checkout 2a17f1648659978cb64b7e93451bff37a85c61be
          echo "HERMES_CORE=/tmp/core" >> "$GITHUB_ENV"

      - name: Install core-facing dependencies
        run: |
          python -m pip install pytest pyyaml httpx "ruamel.yaml"
          # Install the core itself so agent.* imports resolve its deps.
          python -m pip install -e /tmp/core --no-deps 2>/dev/null || echo "core deps best-effort"

      - name: Run host-contract tests (mandatory here)
        run: python -m pytest tests/test_host_contract.py -v

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

      - name: No personal or machine-specific paths
        run: |
          if grep -RniE '/Users/|/home/[a-z]|C:\\\\Users|\.cursor' --include='*.py' --include='*.js' --include='*.mjs' --include='*.yaml' --include='*.md' . --exclude-dir=.git; then
            echo "::error::Personal, setup-specific or forbidden-dependency identifiers found"; exit 1
          fi

      - name: Text reads must declare an encoding
        run: |
          # The windows-latest matrix leg defaults to cp1252, so a bare
          # read_text()/read() raises UnicodeDecodeError on the first non-ASCII
          # byte in the repo (the sources use box-drawing section rules and the
          # block notice carries an emoji). Always pass encoding="utf-8".
          # Static repo grep only — no untrusted input is interpolated here.
          if grep -rnE "\.read_text\(\)|open\([^)]*\)\.read\(\)" --include='*.py' . --exclude-dir=.git; then
            echo "::error::read text files with encoding=\"utf-8\""; exit 1
          fi
