name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Run tests before packaging
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests -q

      - name: Build package
        run: python scripts/package.py

      - name: Create GitHub release with the plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/usage-guard-*.zip \
            --title "usage-guard $TAG" \
            --generate-notes
