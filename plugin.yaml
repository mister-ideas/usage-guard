name: usage-guard
version: 0.1.3
description: "Usage-exhaustion guard: reads account usage into its own cache (core fetcher; a direct read for the Anthropic source, whose host parser inflates sub-1% windows) and denies llm_execution when a configured provider's usage window is exhausted on fresh data; a rate-limited or failing refresh keeps deciding on the last good snapshot instead of refusing; configurable stale-data policy (fail-closed by default)."
author: mister-ideas
license: MIT
kind: standalone
requires_hermes: ">=0.21"
provides_tools: []
provides_hooks: []
provides_middleware:
  - llm_execution
config_schema:
  provider_keys:
    type: list
    default: ["anthropic", "openai-codex"]
    description: "Provider IDs (middleware payload) this guard gates on usage data; add custom provider plugin IDs here"
  provider_sources:
    type: dict
    default: {"anthropic": "anthropic", "openai-codex": "openai-codex"}
    description: "provider-id -> fetch_account_usage data-source key; unmapped providers use their own ID"
  source_scales:
    type: dict
    default: {"anthropic": "percent", "openai-codex": "percent", "openrouter": "percent"}
    description: "data-source key -> value scale: 'percent' (0-100, the host contract) or 'fraction' (0-1, scaled x100); undeclared sources are read as percentages and logged once"
  min_fetch_interval_s:
    type: float
    default: 30.0
    description: "Hard floor between two network reads of one source (enforced across processes); prevents the usage endpoint from rate-limiting the guard. 0 disables"
  stale_grace_s:
    type: float
    default: 900.0
    description: "While a refresh is failing or rate-limited, keep deciding on the last good snapshot for up to this long instead of refusing. 0 restores the strict stale policy"
  threshold_percent:
    type: float
    default: 100.0
    description: "Deny when ANY window used_percent >= this value on a fresh snapshot (100 = block only at 0% left)"
  max_cache_age_s:
    type: float
    default: 60.0
    description: "Snapshots older than this are stale; stale/missing data follows the fail_open policy"
  poll_wait_timeout_s:
    type: float
    default: 20.0
    description: "On a stale snapshot, wait up to this many seconds for a synchronous refresh before applying the fail_open policy (0 disables the wait)"
  fail_open:
    type: bool
    default: false
    description: "Allow requests when usage data is stale/missing/unavailable (false = deny, recommended)"
  refresh_every_request:
    type: bool
    default: true
    description: "Require a new usage snapshot at every guarded ingress; unconfirmed refresh denies"
